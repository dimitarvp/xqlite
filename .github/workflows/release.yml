name: Build precompiled NIFs

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build_release:
    name: NIF ${{ matrix.nif }} - ${{ matrix.job.target }} (${{ matrix.job.os }})
    runs-on: ${{ matrix.job.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        nif: ["2.17"]
        job:
          - { target: aarch64-apple-darwin,        os: macos-15 }
          - { target: x86_64-apple-darwin,         os: macos-15 }
          - { target: aarch64-unknown-linux-gnu,    os: ubuntu-22.04, use-cross: true }
          - { target: aarch64-unknown-linux-musl,   os: ubuntu-22.04, use-cross: true }
          - { target: riscv64gc-unknown-linux-gnu,   os: ubuntu-22.04, use-cross: true }
          - { target: x86_64-unknown-linux-gnu,     os: ubuntu-22.04 }
          - { target: x86_64-unknown-linux-musl,    os: ubuntu-22.04, use-cross: true }
          - { target: x86_64-pc-windows-msvc,       os: windows-2022 }

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract project version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^.*version: "\(.*\)".*/\1/p' mix.exs | head -n1)
          echo "PROJECT_VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Add Rust target
        shell: bash
        run: rustup target add ${{ matrix.job.target }}

      - name: Build the project
        id: build-crate
        uses: philss/rustler-precompiled-action@v1.1.4
        with:
          project-name: xqlitenif
          project-version: ${{ env.PROJECT_VERSION }}
          target: ${{ matrix.job.target }}
          nif-version: ${{ matrix.nif }}
          use-cross: ${{ matrix.job.use-cross }}
          cross-version: "from-source"
          project-dir: "native/xqlitenif"

      # Report-only on purpose. The symbol that proves unwinding differs per
      # target family — glibc imports the unwinder, musl links it in and may
      # hide it, MSVC unwinds through Windows exceptions — so a marker that is
      # wrong for one family would block that target's asset and force a patch
      # release. The job summaries of the first tag that runs this step say
      # what each family really shows; the check turns blocking after that.
      - name: Panic strategy of the built library
        continue-on-error: true
        shell: bash
        run: |
          set -u
          rustup component add llvm-tools

          SYSROOT="$(rustc --print sysroot)"
          if command -v cygpath > /dev/null 2>&1; then
            SYSROOT="$(cygpath -u "${SYSROOT}")"
          fi
          HOST="$(rustc -vV | sed -n 's/^host: //p')"
          BIN="${SYSROOT}/lib/rustlib/${HOST}/bin"

          NM="${BIN}/llvm-nm"
          [ -x "${NM}" ] || NM="${NM}.exe"
          # A Windows DLL's imports are not in the symbol table llvm-nm reads,
          # so the import directory is read with llvm-objdump instead.
          OBJDUMP="${BIN}/llvm-objdump"
          [ -x "${OBJDUMP}" ] || OBJDUMP="${OBJDUMP}.exe"

          UNPACKED="$(mktemp -d)"
          tar -xzf "${{ steps.build-crate.outputs.file-path }}" -C "${UNPACKED}"
          LIBRARY="$(find "${UNPACKED}" -type f \( -name '*.so' -o -name '*.dll' -o -name '*.dylib' \) | head -n 1)"

          if [ -n "${LIBRARY}" ]; then
            LIBRARY_LINE="${LIBRARY}"
          else
            LIBRARY_LINE="none found under ${UNPACKED}"
          fi

          READOUT="$({
            "${NM}" "${LIBRARY}"
            "${NM}" --dynamic "${LIBRARY}"
            "${OBJDUMP}" -p "${LIBRARY}"
          } 2>&1 || true)"
          MARKERS="$(printf '%s\n' "${READOUT}" | grep -E 'Unwind|CxxThrow|CxxFrameHandler|rust_panic|panic_unwind' || true)"

          # An empty readout is "could not read", not "the marker is absent":
          # a library that was never found reads as a negative verdict
          # otherwise, which is the opposite of what it means.
          if [ -z "${READOUT//[[:space:]]/}" ]; then
            UNWIND="could not read (empty readout)"
            THROW="could not read (empty readout)"
          else
            if printf '%s\n' "${READOUT}" | grep -q '_Unwind_RaiseException'; then
              UNWIND="yes — _Unwind_RaiseException is there (ELF and Mach-O)"
            else
              UNWIND="no _Unwind_RaiseException"
            fi

            if printf '%s\n' "${READOUT}" | grep -q '_CxxThrowException'; then
              THROW="yes — _CxxThrowException is imported (MSVC)"
            else
              THROW="no _CxxThrowException"
            fi
          fi

          {
            echo "### Panic strategy — ${{ matrix.job.target }}"
            echo
            echo "Library: ${LIBRARY_LINE}"
            echo "Symbol tool: ${NM}"
            echo "Import-table tool: ${OBJDUMP}"
            echo
            echo "- unwinding runtime: ${UNWIND}"
            echo "- Windows exceptions: ${THROW}"
            echo
            echo '```'
            printf '%s\n' "${MARKERS}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Artifact upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build-crate.outputs.file-name }}
          path: ${{ steps.build-crate.outputs.file-path }}

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build-crate.outputs.file-path }}
