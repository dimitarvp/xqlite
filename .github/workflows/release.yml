name: Build precompiled NIFs

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build_release:
    name: NIF ${{ matrix.nif }} - ${{ matrix.job.target }} (${{ matrix.job.os }})
    runs-on: ${{ matrix.job.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        nif: ["2.17"]
        job:
          - { target: aarch64-apple-darwin,        os: macos-15 }
          - { target: x86_64-apple-darwin,         os: macos-15 }
          - { target: aarch64-unknown-linux-gnu,    os: ubuntu-22.04, use-cross: true }
          - { target: aarch64-unknown-linux-musl,   os: ubuntu-22.04, use-cross: true }
          - { target: riscv64gc-unknown-linux-gnu,   os: ubuntu-22.04, use-cross: true }
          - { target: x86_64-unknown-linux-gnu,     os: ubuntu-22.04 }
          - { target: x86_64-unknown-linux-musl,    os: ubuntu-22.04, use-cross: true }
          - { target: x86_64-pc-windows-msvc,       os: windows-2022 }

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract project version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^.*version: "\(.*\)".*/\1/p' mix.exs | head -n1)
          echo "PROJECT_VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Add Rust target
        shell: bash
        run: rustup target add ${{ matrix.job.target }}

      - name: Build the project
        id: build-crate
        uses: philss/rustler-precompiled-action@v1.1.4
        with:
          project-name: xqlitenif
          project-version: ${{ env.PROJECT_VERSION }}
          target: ${{ matrix.job.target }}
          nif-version: ${{ matrix.nif }}
          use-cross: ${{ matrix.job.use-cross }}
          cross-version: "from-source"
          project-dir: "native/xqlitenif"

      # A Rust panic has to unwind for rustler to catch it, so a library built
      # to abort fails its job here, before the upload. The markers are the
      # ones scripts/panic_strategy.exs reads; this job has no Erlang to run it.
      - name: Panic strategy of the built library
        shell: bash
        run: |
          set -u
          rustup component add llvm-tools

          SYSROOT="$(rustc --print sysroot)"
          if command -v cygpath > /dev/null 2>&1; then
            SYSROOT="$(cygpath -u "${SYSROOT}")"
          fi
          HOST="$(rustc -vV | sed -n 's/^host: //p')"
          BIN="${SYSROOT}/lib/rustlib/${HOST}/bin"

          UNPACKED="$(mktemp -d)"
          tar -xzf "${{ steps.build-crate.outputs.file-path }}" -C "${UNPACKED}"
          LIBRARY="$(find "${UNPACKED}" -type f \( -name '*.so' -o -name '*.dll' -o -name '*.dylib' \) | head -n 1)"

          # A DLL has no symbol table for llvm-nm; MSVC unwinds through
          # Windows exceptions, which its import table names.
          case "${LIBRARY}" in
            *.dll) TOOL="${BIN}/llvm-objdump"; ARGS="-p"; MARKERS='_CxxThrowException|__CxxFrameHandler3' ;;
            *) TOOL="${BIN}/llvm-nm"; ARGS="-u"; MARKERS='_Unwind_RaiseException' ;;
          esac
          [ -x "${TOOL}" ] || TOOL="${TOOL}.exe"

          READ_EXIT=0; READOUT="$([ -n "${LIBRARY}" ] && "${TOOL}" ${ARGS} "${LIBRARY}")" || READ_EXIT=$?
          FOUND="$(printf '%s\n' "${READOUT}" | grep -E "${MARKERS}" || true)"

          {
            echo "### Panic strategy — ${{ matrix.job.target }}"
            echo
            echo "Library: ${LIBRARY:-none found under ${UNPACKED}}"
            echo "Read with: ${TOOL} ${ARGS}"
            echo
            echo '```'
            printf '%s\n' "${FOUND:-no ${MARKERS} marker}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ "${READ_EXIT}" -ne 0 ] || [ -z "${READOUT//[[:space:]]/}" ]; then
            echo "::error::could not read a library out of the built archive"
            exit 1
          fi
          if [ -z "${FOUND}" ]; then
            echo "::error::no ${MARKERS} marker: this build aborts on a panic"
            exit 1
          fi

      - name: Artifact upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build-crate.outputs.file-name }}
          path: ${{ steps.build-crate.outputs.file-path }}

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build-crate.outputs.file-path }}
