[env]
# `sqlite3_stmt_scanstatus*` is gated on this compile-time flag — without it
# the API returns SQLITE_MISUSE. Paid cost: a few counters tracked per
# prepared statement. Benefit: per-scan row counts, loop counts, and
# estimated rows, which drive `Xqlite.explain_analyze/3`.
LIBSQLITE3_FLAGS = { value = "-DSQLITE_ENABLE_STMT_SCANSTATUS=1", force = true }

# rustler wraps every NIF — argument decoding included — in `catch_unwind`, so
# a Rust panic becomes a catchable `:nif_panicked` instead of killing the VM.
# That guard only works while panics unwind. A cargo config file outranks the
# manifest's `[profile.*]`, so a machine-wide `panic = "abort"` would silently
# disarm it; these two lines outrank that one.
[profile.release]
panic = "unwind"

[profile.dev]
panic = "unwind"

[target.'cfg(target_os = "macos")']
rustflags = ["-C", "link-arg=-undefined", "-C", "link-arg=dynamic_lookup"]

[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=-crt-static"]

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "target-feature=-crt-static"]
